    <title>Pitágoras</title>

<body>
    <h1>Teorema de Pitágoras</h1>

    <input type="number" id="x" placeholder="X">

        const b = bValor.value
        const x = xValor.value
        //Function

                const a = ((b*b) - (x*x)) ** 0.5
                return a;
            };

        const catetoB = (a, x) => {
                const b = ((a*a) - (x*x)) ** 0.5
                return b;
            };

        const catetoX = (a, b) => {

                return x;
            };


        //Validação e output
        if(Number.isNaN(a)){

            resultado
        }
    </script>
</body>
